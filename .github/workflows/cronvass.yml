# Cronvass — the scheduled canvasser.
# Every six hours it asks scvotes.gov for the full election calendar, rewrites
# data/elections.json, and commits the result. The web page reads that file.
# Nothing here needs Claude, a laptop, or a human.

name: Cronvass — Refresh Election Data

on:
  schedule:
    - cron: "17 */6 * * *"      # 00:17, 06:17, 12:17, 18:17 UTC — off the hour so
                                # it is not queued behind GitHub's :00 rush.
                                # Every run commits, so the repo is never idle.
  workflow_dispatch:            # the "Run workflow" button, for on-demand checks
  push:
    paths:
      - "scripts/fetch-elections.mjs"
      - ".github/workflows/cronvass.yml"

permissions:
  contents: write

concurrency:
  group: cronvass
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out The Repository
        uses: actions/checkout@v5

      - name: Set Up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Pull The Election Calendar
        run: node scripts/fetch-elections.mjs

      # Optional, and deliberately non-fatal. Without an FEC_API_KEY secret the
      # script prints why and exits 0; without data/congress.json the page just
      # omits the seat-by-seat federal rows. A free key: https://api.data.gov/signup/
      # Add it at Settings -> Secrets and variables -> Actions -> New repository secret.
      # No key, no secret — one keyless CC0 CSV from Open States. It rewrites
      # data/seats.json only when the roster actually changes, so it does not
      # churn the repository four times a day.
      - name: Pull The Seat Roster
        continue-on-error: true
        run: node scripts/fetch-seats.mjs

      - name: Pull The Federal Roster
        continue-on-error: true
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: node scripts/fetch-congress.mjs

      # Commit on every run, not only when the data changed. The file always
      # differs because checked_at moves each time, and that is the point: a
      # repository with no commits for 60 days has its scheduled workflows
      # disabled by GitHub, and a job that only commits when the news is
      # interesting will eventually go quiet long enough to switch itself off.
      # A year of this costs about 1 MB of packed history.
      # `if: always()` so a bad afternoon at scvotes.gov still leaves a commit.
      # A repository with no commits for 60 days has its scheduled workflows
      # switched off by GitHub, and a run that failed earlier is exactly when you
      # least want the schedule to lapse. The run still shows red — this only
      # keeps the heartbeat going. Nothing is committed if nothing changed.
      - name: Commit The Check
        if: always()
        run: |
          git config user.name  "cronvass[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `git add data/` rather than naming files: data/congress.json only
          # exists when an FEC key is set, and naming a missing path fails.
          git add data/
          if git diff --staged --quiet; then
            echo "Nothing staged — fetch-elections.mjs did not write. Not committing."
            exit 0
          fi
          if grep -q '"changed_this_run": true' data/elections.json; then
            MSG="Cronvass: election data CHANGED ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          else
            MSG="Cronvass: checked, no change ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          fi
          git commit -m "$MSG"
          git push
